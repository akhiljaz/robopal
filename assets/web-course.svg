<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Web course illustration</title>
  <desc id="desc">Colorful browser and code illustration for HTML, CSS, and JavaScript learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="120" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="160" cy="660" r="160" fill="#f59e0b" fill-opacity=".16"/>
  <rect x="130" y="120" width="940" height="560" rx="34" fill="url(#browser)" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="130" y="120" width="940" height="84" rx="34" fill="#dbeafe"/>
  <circle cx="190" cy="162" r="14" fill="#fb7185"/>
  <circle cx="230" cy="162" r="14" fill="#f59e0b"/>
  <circle cx="270" cy="162" r="14" fill="#22c55e"/>
  <rect x="330" y="146" width="450" height="32" rx="16" fill="#ffffff" fill-opacity=".85"/>
  <rect x="190" y="250" width="310" height="340" rx="24" fill="#0f172a"/>
  <text x="230" y="315" fill="#f97316" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="700">&lt;html&gt;</text>
  <text x="230" y="372" fill="#38bdf8" font-size="34" font-family="Arial, Helvetica, sans-serif">.hero { color: fun; }</text>
  <text x="230" y="430" fill="#facc15" font-size="34" font-family="Arial, Helvetica, sans-serif">button.onclick = wow;</text>
  <text x="230" y="488" fill="#a78bfa" font-size="34" font-family="Arial, Helvetica, sans-serif">&lt;/html&gt;</text>
  <rect x="548" y="250" width="430" height="340" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="588" y="292" width="350" height="48" rx="18" fill="#7c3aed"/>
  <rect x="588" y="362" width="150" height="150" rx="24" fill="#14b8a6"/>
  <rect x="756" y="362" width="182" height="68" rx="18" fill="#f59e0b"/>
  <rect x="756" y="444" width="182" height="68" rx="18" fill="#ec4899"/>
  <rect x="588" y="540" width="350" height="20" rx="10" fill="#cbd5e1"/>
  <text x="150" y="740" fill="#ffffff" font-size="54" font-family="Arial, Helvetica, sans-serif" font-weight="700">Web Creators Studio</text>
</svg>
